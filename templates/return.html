{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 560px;">
  <h2>Return "{{ item.name }}"</h2>
  <p style="color:var(--text-muted); margin-bottom: 20px; font-size: 13.5px;">
    On loan: <strong style="color:var(--text)">{{ outstanding }}</strong>
    · In stock: <strong style="color:var(--text)">{{ item.quantity }}</strong>
  </p>
  <form method="POST">
    <label>Quantity to return</label>
    <input name="qty" type="number" min="1" max="{{ outstanding }}" value="{{ outstanding }}" required autofocus>

    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Confirm return</button>
      <a class="btn" href="{{ url_for('view_item', item_id=item.id) }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
