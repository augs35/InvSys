{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 560px;">
  <h2>Borrow "{{ item.name }}"</h2>
  <p style="color:var(--text-muted); margin-bottom: 20px; font-size: 13.5px;">
    In stock: <strong style="color:var(--text)">{{ item.quantity }}</strong>
  </p>
  <form method="POST">
    <label>Borrower's name</label>
    <input name="borrower" required placeholder="" autofocus>

    <label>Quantity</label>
    <input name="qty" type="number" min="1" max="{{ item.quantity }}" value="1" required>

    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Confirm borrow</button>
      <a class="btn" href="{{ url_for('view_item', item_id=item.id) }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
