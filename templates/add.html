{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 560px;">
  <h2>Add item</h2>
  <form method="POST">
    <label>Name</label>
    <input name="name" required placeholder="e.g. Pencil" autofocus>

    <label>Description</label>
    <textarea name="description" rows="3" placeholder="Optional notes"></textarea>

    <label>Quantity</label>
    <input name="quantity" type="number" value="1" min="0">

    <label>Folder</label>
    <select name="folder_id">
      <option value="">— No folder (root) —</option>
      {% for f in all_folders %}
        <option value="{{ f.id }}" {% if preselected_folder == f.id %}selected{% endif %}>{{ f.name }}</option>
      {% endfor %}
    </select>

    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn" href="{% if preselected_folder %}{{ url_for('folder_view', folder_id=preselected_folder) }}{% else %}{{ url_for('folders_root') }}{% endif %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
