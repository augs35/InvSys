{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 560px;">
  <h2>Edit item</h2>
  <form method="POST">
    <label>Name</label>
    <input name="name" required value="{{ item.name }}">

    <label>Description</label>
    <textarea name="description" rows="3">{{ item.description }}</textarea>

    <label>Quantity</label>
    <input name="quantity" type="number" value="{{ item.quantity }}" min="0">

    <label>Folder</label>
    <select name="folder_id">
      <option value="">— No folder (root) —</option>
      {% for f in all_folders %}
        <option value="{{ f.id }}" {% if item.folder_id == f.id %}selected{% endif %}>{{ f.name }}</option>
      {% endfor %}
    </select>

    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Save changes</button>
      <a class="btn" href="{{ url_for('view_item', item_id=item.id) }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
