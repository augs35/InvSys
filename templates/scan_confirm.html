<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Scan — {{ item.name }}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:            #0a0b0f;
    --surface:       #14161d;
    --surface-2:     #191c24;
    --border:        #23262f;
    --border-strong: #2e323d;
    --text:          #f3f4f6;
    --text-muted:    #9ba1ad;
    --text-subtle:   #6b7280;
    --accent:        #6366f1;
    --accent-hover:  #7c7ff2;
    --accent-soft:   rgba(99, 102, 241, 0.12);
    --warning:       #f59e0b;
    --warning-soft:  rgba(245, 158, 11, 0.12);
    --success:       #10b981;
    --success-soft:  rgba(16, 185, 129, 0.12);
    --shadow-lg:     0 12px 32px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.3);
    --shadow-glow:   0 0 0 1px rgba(99,102,241,0.2), 0 8px 24px rgba(99,102,241,0.25);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
  }

  body::before {
    content: '';
    position: fixed;
    top: -300px;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 500px;
    background: radial-gradient(ellipse at center, rgba(99,102,241,0.18), transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  .panel {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px 24px;
    box-shadow: var(--shadow-lg);
    animation: rise 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.1);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0)    scale(1); }
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 4px;
  }
  .item-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  /* Action toggle */
  .action-toggle {
    display: flex;
    gap: 2px;
    padding: 3px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 18px;
  }
  .action-toggle label {
    flex: 1;
    margin: 0;
    position: relative;
    cursor: pointer;
  }
  .action-toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .action-toggle span {
    display: block;
    text-align: center;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    border-radius: 6px;
    transition: all 0.15s ease;
  }
  .action-toggle input:checked + span {
    background: var(--surface-2);
    color: var(--text);
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .action-toggle input[value="borrow"]:checked + span { color: #fbbf24; }
  .action-toggle input[value="return"]:checked + span { color: #34d399; }

  /* Stock row */
  .stock-row {
    display: flex;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .stock-cell {
    flex: 1;
    background: var(--surface-2);
    padding: 12px 14px;
  }
  .stock-cell .k {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-subtle);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 3px;
  }
  .stock-cell .v {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  /* Form */
  form { text-align: left; }
  label.field-label {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 8px;
    margin-top: 16px;
    letter-spacing: 0.01em;
  }
  label.field-label:first-of-type { margin-top: 0; }

  input[type="text"], input[type="number"] {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    font-weight: 500;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input::placeholder { color: var(--text-subtle); font-weight: 400; }
  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
  }

  /* Quantity stepper */
  .qty-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .qty-btn {
    flex: 0 0 48px;
    height: 48px;
    border: 1px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text);
    font-size: 20px;
    font-weight: 500;
    font-family: inherit;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: grid;
    place-items: center;
  }
  .qty-btn:hover { background: var(--surface); border-color: #3a3f4b; }
  .qty-btn:active { transform: translateY(1px); }
  .qty-input {
    flex: 1;
    text-align: center;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .qty-input::-webkit-outer-spin-button,
  .qty-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  /* Preview */
  .preview {
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .preview strong {
    color: var(--text);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  button.submit {
    width: 100%;
    height: 48px;
    margin-top: 18px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    letter-spacing: -0.005em;
    cursor: pointer;
    transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  button.submit:hover { background: var(--accent-hover); box-shadow: var(--shadow-glow); }
  button.submit:active { transform: translateY(1px); }

  .footer-hint {
    margin-top: 16px;
    text-align: center;
    font-size: 12px;
    color: var(--text-subtle);
  }
</style>
</head>
<body>
  <div class="panel">
    <h1>{{ item.name }}</h1>
    <div class="item-name">Record a borrow or return</div>

    <div class="stock-row">
      <div class="stock-cell">
        <div class="k">In stock</div>
        <div class="v" id="stockDisplay">{{ item.quantity }}</div>
      </div>
      <div class="stock-cell">
        <div class="k">On loan</div>
        <div class="v" id="loanDisplay">{{ outstanding }}</div>
      </div>
    </div>

    <form method="POST" id="scanForm">
      {% if can_borrow and can_return %}
      <div class="action-toggle">
        <label>
          <input type="radio" name="action" value="borrow" {% if action == 'borrow' %}checked{% endif %}>
          <span>Borrow</span>
        </label>
        <label>
          <input type="radio" name="action" value="return" {% if action == 'return' %}checked{% endif %}>
          <span>Return</span>
        </label>
      </div>
      {% else %}
      <input type="hidden" name="action" value="{{ action }}">
      {% endif %}

      <label class="field-label" for="who">Your name</label>
      <input type="text" id="who" name="who" required
             placeholder=""
             autocomplete="name" autocapitalize="words">

      <label class="field-label" for="qty">Quantity</label>
      <div class="qty-row">
        <button type="button" class="qty-btn" onclick="step(-1)" aria-label="Decrease">−</button>
        <input type="number" id="qty" name="qty" class="qty-input"
               min="1" value="1" required inputmode="numeric">
        <button type="button" class="qty-btn" onclick="step(1)" aria-label="Increase">+</button>
      </div>

      <div class="preview" id="preview">
        <span id="previewLabel">New stock after borrow</span>
        <strong id="previewValue">{{ item.quantity - 1 }}</strong>
      </div>

      <button type="submit" class="submit" id="submitBtn">Confirm</button>
    </form>

    <div class="footer-hint" id="footerHint">Borrowing 1 unit.</div>
  </div>

  <script>
    const stock = {{ item.quantity }};
    const loan  = {{ outstanding }};
    const canBorrow = {{ 'true' if can_borrow else 'false' }};
    const canReturn = {{ 'true' if can_return else 'false' }};

    const qtyInput    = document.getElementById('qty');
    const previewLbl  = document.getElementById('previewLabel');
    const previewVal  = document.getElementById('previewValue');
    const submitBtn   = document.getElementById('submitBtn');
    const footerHint  = document.getElementById('footerHint');

    function currentAction() {
      const r = document.querySelector('input[name="action"]:checked');
      return r ? r.value : (canBorrow ? 'borrow' : 'return');
    }

    function maxQty() {
      return currentAction() === 'borrow' ? stock : loan;
    }

    function step(delta) {
      let v = parseInt(qtyInput.value || '1', 10);
      v = Math.max(1, Math.min(maxQty(), v + delta));
      qtyInput.value = v;
      refresh();
    }

    function refresh() {
      const action = currentAction();
      const max = maxQty();
      qtyInput.max = max;

      let qty = parseInt(qtyInput.value, 10);
      if (isNaN(qty) || qty < 1) qty = 1;
      if (qty > max) qty = max;
      qtyInput.value = qty;

      if (action === 'borrow') {
        previewLbl.textContent = 'New stock after borrow';
        previewVal.textContent = stock - qty;
        submitBtn.textContent  = 'Confirm borrow';
        footerHint.textContent = `Borrowing ${qty} of ${stock} available.`;
      } else {
        previewLbl.textContent = 'New stock after return';
        previewVal.textContent = stock + qty;
        submitBtn.textContent  = 'Confirm return';
        footerHint.textContent = `Returning ${qty} of ${loan} on loan.`;
      }
    }

    // Listeners
    qtyInput.addEventListener('input', refresh);
    document.querySelectorAll('input[name="action"]').forEach(r =>
      r.addEventListener('change', () => { qtyInput.value = 1; refresh(); })
    );

    refresh();
  </script>
</body>
</html>
